# vim:ft=conf
set preview_images true
# set preview_images_method ueberzug
#set colorscheme gruvbox
set preview_script ~/.config/ranger/scope.sh
set use_preview_script true

set cd_tab_case smart
set cd_tab_fuzzy True
#set draw_borders separators
set update_title True
set vcs_aware True
set wrap_scroll True

# map 'yp' to yank the current filename path to the clipboard
map yp eval fm.execute_console('echo %d/%f | xclip -i'))

# enable drag-and-drop via dragon
map yu shell dragon-drop --and-exit %p
